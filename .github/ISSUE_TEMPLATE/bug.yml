name: Bug report / 问题反馈
description: Something in WriteAnytime doesn't work as expected. 功能出错或和预期不一致。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Please don't paste passwords, payment details or long passages of a book you don't own.
        感谢反馈。请不要贴密码、支付信息，或不属于你的长篇原文。
  - type: textarea
    id: what
    attributes:
      label: What happened? / 发生了什么？
      description: What you did, what you expected, what you saw. 你做了什么、预期是什么、实际看到什么。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where? / 在哪里？
      options:
        - Planning board / 构思台
        - Writing (plans, drafts, final) / 写作（企划、正文、定稿）
        - Story bible & library / 设定集与资料库
        - Assistant / 助手
        - Import & export / 导入导出
        - Account & credits / 账号与额度
        - Other / 其他
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device / 浏览器和设备
      placeholder: e.g. Chrome 140 on Windows 11 / 例如 Windows 11 上的 Edge
  - type: textarea
    id: shots
    attributes:
      label: Screenshots / 截图
      description: Optional. 可选。
